<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我的个人网站">
  <title>我的第一个 Codex 项目</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <section class="hero fade-in">
      <div class="avatar" aria-label="我的头像">我</div>
      <p class="eyebrow">你好，我是</p>
      <h1>我的第一个 Codex 项目</h1>
      <p class="intro">一位正在学习网页开发的初学者。我喜欢把想法变成简单、有趣的网页。</p>
      <button id="helloButton" type="button">和我打个招呼</button>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="content-section fade-in delay-1">
      <h2>我的技能</h2>
      <div class="skill-list">
        <span>HTML</span>
        <span>CSS</span>
        <span>JavaScript</span>
        <span>持续学习</span>
      </div>
    </section>

    <section class="content-section learning-progress fade-in delay-2">
      <h2>我的学习进度</h2>

      <div class="progress-item">
        <div class="progress-label"><span>Python</span><span>40%</span></div>
        <div class="progress-track" role="progressbar" aria-label="Python 学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
          <div class="progress-fill" style="--progress: 40%"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-label"><span>Git</span><span>30%</span></div>
        <div class="progress-track" role="progressbar" aria-label="Git 学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="30">
          <div class="progress-fill" style="--progress: 30%"></div>
        </div>
      </div>

      <div class="progress-item">
        <div class="progress-label"><span>Codex</span><span>20%</span></div>
        <div class="progress-track" role="progressbar" aria-label="Codex 学习进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="20">
          <div class="progress-fill" style="--progress: 20%"></div>
        </div>
      </div>
    </section>

    <section class="content-section fade-in delay-3">
      <h2>我的项目</h2>
      <div class="project-list">
        <article class="project-card">
          <h3>个人网站</h3>
          <p>这是我的第一个网页项目，用来介绍自己和记录学习成果。</p>
        </article>
        <article class="project-card">
          <h3>下一个项目</h3>
          <p>我正在学习更多前端知识，未来会在这里展示新的作品。</p>
        </article>
      </div>
    </section>

    <section class="content-section contact fade-in delay-4">
      <h2>联系我</h2>
      <p>邮箱：<a href="mailto:hello@example.com">hello@example.com</a></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
